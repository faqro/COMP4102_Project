method: sift
seed: 42
dataset:
  name: roxford5k
  root: data/raw/roxford5k
  max_image_size: 1024

features:
  n_keypoints: 500
  contrast_threshold: 0.04
  edge_threshold: 10
  sigma: 1.6

bovw:
  vocab_size: 1024
  use_tfidf: true
  max_descriptors_per_image: 500
  sample_size_for_kmeans: 150000
  kmeans_batch_size: 4096
  kmeans_max_iter: 100

retrieval:
  mode: bovw
  similarity: cosine
  ratio_threshold: 0.75
  top_k: 100
